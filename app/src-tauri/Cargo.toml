[package]
name = "lowlag"
version = "0.1.2"
edition = "2021"
description = "LowLag – low-latency remote play"
license = "LicenseRef-Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
llengine = { path = "../../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
