[package]
name = "llcore"
version = "0.1.0"
edition = "2021"
description = "LowLag networking core: code-based signaling, NAT traversal and an encrypted UDP tunnel"
license = "LicenseRef-Proprietary"

[dependencies]
chacha20poly1305 = "0.10"
chacha20 = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
igd-next = "0.15"
log = "0.4"
