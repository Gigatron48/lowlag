[package]
name = "llengine"
version = "0.1.3"
edition = "2021"
description = "LowLag session engine: ties the network core to the streaming host/client and the UI"
license = "LicenseRef-Proprietary"

[dependencies]
llcore = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rand = "0.8"
base64 = "0.22"

# Optional copies so the Windows module can be type-checked elsewhere: `cargo check --features wincheck`.
windows-sys = { version = "0.52", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_System_Threading"] }
ureq = { version = "2", optional = true, default-features = false, features = ["native-tls", "json"] }
native-tls = { version = "0.2", optional = true }

[features]
wincheck = ["dep:windows-sys", "dep:ureq", "dep:native-tls"]

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_System_Threading"] }
